    footnote_ref: ༣ ཆགས་སྡང་གི་རྣམ་རྟོག་སྐྱེ་བའི་རྒྱུ་རང་ཡུལ་སོགས་དང༌།
  c8e74726b4dc4b139b27c2de5d7a202a:
    span:
      start: 42525
      end: 42525
    footnote_ref: ༤ ཡུལ་མི་སོགས་དང༌།
  01de7a9f5f7942858c0b41ef684a12bf:
    span:
      start: 48218
      end: 48218
    footnote_ref: ༡ སོར་བསམ་གཉིས་མཐར་ཐུག་ཟུང་འཇུག་ཡེ་ཤེས་ཀྱི་སྐུ་འགྲུབ་པའི་རྒྱུ་སྟོང་གཟུགས་མངོན་དུ་གྱུར་ཅིང་སྣང་སེམས་དབྱེར་མེད་དུ་སྣང་བའི་རྣལ་འབྱོར་ཡིན་པས་དེ་གཉིས་ཟུང་འཇུག་མཆོག་གི་སྐུ་འགྲུབ་པ་ལ་ཐོག་མར་ཉེ་ལམ་ཡིན་ཕྱིར་ཉེར་སྒྲུབ་དང༌།
      སྲོག་འཛིན་གཉིས་མ་དག་པའི་རླུང་བཀག་ནས་རླུང་ཐིག་དབྱེར་མེད་དུ་བྱེད་པའི་རྣལ་འབྱོར་ཡིན་པས་དེ་གཉིས་སྔར་ལས་ཡེ་ཤེས་ཀྱི་སྐུ་འགྲུབ་པ་ལ་ལྷག་པར་ཉེ་ཕྱིར་ཉེར་སྒྲུབ་དང༌།
      རྗེས་དྲན་ནི་བར་སྣང་གི་ལྷ་སྐུ་འགྲུབ་པའི་རྣལ་འབྱོར་ཡིན་པས་སྒྲུབ་པ་དང༌། ཏིང་འཛིན་མི་འགྱུར་བའི་བདེ་བ་ཡོངས་སུ་རྫོགས་པའི་ཡེ་ཤེས་ཀྱི་སྐུ་འགྲུབ་པ་ཡིན་པས་སྒྲུབ་ཆེན་ནོ།
      །
