  6430328769d2493badc2f02c890186aa:
    span:
      start: 40593
      end: 40593
    footnote_ref: ༡ བདུད་རྩི་ལྔ་སྟེ་གཟུགས་ཕུང་ལ་སོགས་པ་ཕུང་པོ་ལྔ་ལ་ལྟོས་པ་མེད་པ་དང༌།
      སོགས་སྒྲས་བསྟན་པའི་དབང་པོ་ལྔ་ལ་ལྟོས་པ་མེད་པ་དང༌། ཆུ་གཏེར་ཞེས་པ་བཞིའི་མིང་སྟེ།
      ལུས་དང༌། ངག་དང༌། ཡིད་དང༌། འཕོ་བའི་ལོངས་སྤྱོད་ལ་ལྟོས་པ་མེད་པ་དང་ལྟོས་མེད་དྲུག་རྒྱུད་ལས་བསྟན་པ་དེས་དངོས་གཞི་རྡོ་རྗེ་བཞི་སྨིན་པར་བྱེད་དགོས།
      བསྐྱེད་རིམ་གྱི་སྐབས་སུ་ལྷ་འགྲུབ་པའི་ཆེད་དུ་སྔགས་ཀྱི་བཟླས་པ་དང་ཚོགས་དང་གཏོར་མ་འབུལ་བ་སོགས་ཀྱིས་བསྒྲུབ་པའི་དོན་དུ་རྫོགས་རིམ་གྱི་སྐབས་སུ་རླུང་ལས་རུང་དུ་གྱུར་པའི་ཆེད་དུ་འབྱུང་འཇུག་གི་རླུང་རགས་པ་སྦྱོང་བ་རྣམས་དགོས།
  c296d246ebff406fa5c8340b5e51eedb:
    span:
